name: CI

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
jobs:
  # Code quality: formatting and lints. Uses stable so clippy/rustfmt are the
  # current versions.
  quality:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The slim build-dependency configurations must stay compilable; the
      # workspace-wide run above always enables default features through the
      # generator binary and dev-dependencies.
      - name: cargo clippy (slim feature sets)
        run: |
          cargo clippy -p dbt-antlr-runtime --no-default-features -- -D warnings
          cargo clippy -p dbt-antlr-codegen --no-default-features -- -D warnings
          cargo clippy -p dbt-antlr-codegen --no-default-features --features download -- -D warnings

      # The runtime has a big-endian path that the host targets never compile.
      - name: Install big-endian target
        run: rustup target add s390x-unknown-linux-gnu

      - name: cargo check (big-endian)
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check -p dbt-antlr-runtime --lib --target s390x-unknown-linux-gnu
          cargo check -p dbt-antlr-runtime --lib --features ffi --target s390x-unknown-linux-gnu

      - name: Check Cargo and Python package versions match
        run: |
          python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              cargo_ver = tomllib.load(f)["workspace"]["package"]["version"]
          with open("python/pyproject.toml", "rb") as f:
              py_ver = tomllib.load(f)["project"]["version"]
          if cargo_ver != py_ver:
              raise SystemExit(f"version mismatch: Cargo.toml={cargo_ver}, python/pyproject.toml={py_ver}")
          PY

  # Workspace unit/integration tests on the MSRV and current stable.
  unittests:
    name: cargo test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        rust: [ "1.96", stable ]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Exclude build dirs from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}

      - name: cargo build dbt-antlr-codegen
        run: cargo build --bin dbt-antlr-codegen

      # Compile-check the pinned-binary download path on every OS; the
      # workspace-wide jobs only build it on Linux.
      - name: cargo check (download feature)
        run: cargo check -p dbt-antlr-codegen --no-default-features --features download

      - name: cargo test
        run: cargo test --workspace --all-targets

  release-tests:
    name: Release test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-tests

      - name: cargo test --release
        run: |
          cargo test --release --workspace --all-targets
          cargo test --release -p dbt-antlr-ffi-test-bundle --features arena-allocation-limit

  # Self-hosting guarantee: regenerating the g4-parser front-end and the
  # runtime test goldens with the shipped codegen must be a zero diff.
  bootstrap:
    name: bootstrap fixpoint + goldens
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: bootstrap

      - name: Regenerate g4-parser front-end
        run: crates/dbt-antlr-g4-parser/regen_frontend.sh

      - name: Regenerate runtime test goldens
        run: crates/dbt-antlr-runtime/gen_test_grammars.sh

      - name: Regenerate the FFI test bundle
        run: tests/ffi-bundle/gen_grammars.sh

      - name: Verify zero diff
        run: git diff --exit-code

  # Upstream ANTLR runtime conformance suite, driven end-to-end against
  # generated Rust parsers. The cases are vendored post-rendered under
  # tests/runtime-testsuite/corpus, so the sweep needs no JVM and no network.
  runtime-testsuite:
    name: runtime conformance suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: testsuite

      - name: Run runtime conformance suite
        run: cargo run -p runtime-testsuite --release --color never

      - name: Run static dfa runtime conformance suite
        run: cargo run -p runtime-testsuite --release --color never -- --static-lexer-dfa --static-parser-dfa

  # The dbt_antlr Python package, against the FFI test bundle
  # (tests/ffi-bundle) linked into a CFFI extension module.
  python:
    name: python bindings (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python: [ "3.10", "3.14" ]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.os }}

      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the Python test dependencies
        run: python -m pip install build cffi pytest setuptools

      - name: Build wheel and sdist
        if: runner.os == 'Linux' && matrix.python == '3.10'
        run: python -m build python --outdir "${{ runner.temp }}/dbt-antlr-dist"

      - name: pytest
        run: python -m pytest python/tests

  # Release PRs are opened by GITHUB_TOKEN, so they never trigger
  # pull_request workflows; the Release-plz workflow dispatches this
  # workflow onto the release branch instead. workflow_dispatch check runs
  # do not show up in the PR rollup, so mirror the aggregated result as a
  # classic commit status, which does.
  ci-status:
    name: ci status
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [quality, unittests, release-tests, bootstrap, runtime-testsuite, python]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish aggregated commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          state=success
          for result in $(echo "$NEEDS" | jq -r '.[].result'); do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              state=failure
            fi
          done
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="ci (dispatched)" \
            -f description="Aggregated result of the CI run dispatched by Release-plz" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
