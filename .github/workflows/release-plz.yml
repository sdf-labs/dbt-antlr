name: Release-plz

# Maintains per-crate release PRs on every push to main, and publishes a
# crate when its release PR is merged. Requires the CARGO_REGISTRY_TOKEN
# repository secret (a crates.io API token with publish rights to the three
# workspace crates).

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch the CI workflow onto release PR branches

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Find the open release PR
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="$(gh pr list --state open --json headRefName \
            --jq '[.[].headRefName | select(startswith("release-plz-"))] | .[0] // ""')"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The release PR bumps the workspace version, which changes the
      # check_version! stamps in freshly generated recognizers. Regenerate
      # the checked-in recognizers on the release branch so that version,
      # stamps, and checked-in files agree when the release PR merges.
      - name: Regenerate checked-in recognizers on the release PR
        if: steps.release-pr.outputs.branch != ''
        run: |
          branch="${{ steps.release-pr.outputs.branch }}"
          git fetch --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          git checkout -b "$branch" "refs/remotes/origin/$branch"
          crates/dbt-antlr-g4-parser/regen_frontend.sh
          crates/dbt-antlr-runtime/gen_test_grammars.sh
          if git diff --quiet; then
            echo "checked-in recognizers already match the bumped version"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: regenerate checked-in recognizers for the version bump"
            git push origin "HEAD:$branch"
          fi

      # GitHub never runs pull_request workflows for PRs opened by
      # GITHUB_TOKEN (anti-recursion), so release PRs would otherwise get no
      # CI. workflow_dispatch is the one exception GITHUB_TOKEN can trigger;
      # the dispatched run attaches to the release branch head commit and
      # shows up in the release PR checks.
      - name: Run CI on the open release PR
        if: steps.release-pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "${{ steps.release-pr.outputs.branch }}"
