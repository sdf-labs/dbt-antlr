name: Release-plz

# Maintains per-crate release PRs on every push to main, and publishes a
# crate when its release PR is merged. Requires the CARGO_REGISTRY_TOKEN
# repository secret (a crates.io API token with publish rights to the three
# workspace crates).

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch the CI workflow onto release PR branches

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # GitHub never runs pull_request workflows for PRs opened by
      # GITHUB_TOKEN (anti-recursion), so release PRs would otherwise get no
      # CI. workflow_dispatch is the one exception GITHUB_TOKEN can trigger;
      # the dispatched run attaches to the release branch head commit and
      # shows up in the release PR checks.
      - name: Run CI on the open release PR
        run: |
          gh pr list --state open --json headRefName \
            --jq '.[].headRefName | select(startswith("release-plz-"))' \
            | while read -r branch; do
                gh workflow run ci.yml --ref "$branch"
                echo "dispatched CI on $branch"
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
