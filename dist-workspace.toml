[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Binary distribution is currently DISABLED: .github/workflows/release.yml was
# removed (see RELEASE.md, "Binary distribution"). This config stays so
# re-enabling is cheap; allow-dirty lets local `dist plan` run without the
# generated workflow file.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# Build scripts in pinned-release mode extract archives with a pure-Rust
# stack (flate2/tar/zip); .tar.gz keeps that free of C toolchain requirements.
unix-archive = ".tar.gz"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
