# release-plz configuration: lock-step versioning (one shared workspace
# version), per-crate publishing.
#
# Flow: on every push to main, release-plz opens or refreshes one release PR
# per crate with unreleased changes (changelogs come from commit messages).
# Merging a release PR publishes that crate to crates.io in dependency order
# (dbt-antlr-runtime -> dbt-antlr-g4-parser -> dbt-antlr-codegen), tags the
# release commit, and creates the GitHub release.


[workspace]
# `codegen:` commits deliver user-facing tool features: they bump the minor
# version (also on 0.x, where `feat` alone would only bump patch).
custom_minor_increment_regex = "^codegen"

[changelog]
protect_breaking_commits = true
commit_parsers = [
  { message = "^codegen", group = "added" },
  { message = "^feat", group = "added" },
  { message = "^fix", group = "fixed" },
  { message = "^security", group = "security" },
  { message = "^deprecated", group = "deprecated" },
  { message = "^docs", group = "documentation" },
  { message = "^test", group = "tests" },
  { message = "^chore: release", skip = true },
  { message = "^.*", group = "other" },
]
[[package]]
name = "dbt-antlr-runtime"
version_group = "dbt-antlr"
git_tag_name = "dbt-antlr-runtime-v{{ version }}"
git_release_enable = true

[[package]]
name = "dbt-antlr-g4-parser"
version_group = "dbt-antlr"
git_tag_name = "dbt-antlr-g4-parser-v{{ version }}"
git_release_enable = true

[[package]]
name = "dbt-antlr-codegen"
version_group = "dbt-antlr"
git_tag_name = "dbt-antlr-codegen-v{{ version }}"
git_release_enable = true
