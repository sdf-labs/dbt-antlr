[workspace]
members = [
  "crates/dbt-antlr-g4-parser",
  "crates/dbt-antlr-codegen",
  "crates/dbt-antlr-runtime",
  "tests/runtime-testsuite",
  "tests/build-generate",
]
resolver = "3"
# Makes bare `cargo run` execute the `dbt-antlr-codegen` generator binary.
default-members = ["crates/dbt-antlr-codegen"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
license = "BSD-3-Clause"
repository = "https://github.com/sdf-labs/dbt-antlr"
homepage = "https://github.com/sdf-labs/dbt-antlr"

[workspace.dependencies]
dbt-antlr-g4-parser = { path = "crates/dbt-antlr-g4-parser", version = "=0.1.1" }
dbt-antlr-codegen = { path = "crates/dbt-antlr-codegen", version = "=0.1.1", default-features = false }
dbt-antlr-runtime = { path = "crates/dbt-antlr-runtime", version = "=0.1.1" }
icu_properties = { version = "2.2.0", features = ["alloc"] }
insta = { version = "1", default-features = false }
memchr = "2"
minijinja = { version = "2.24", features = ["builtins"] }
thiserror = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
inefficient_to_string = "warn"
str_to_string = "warn"
string_lit_as_bytes = "warn"
too_many_lines = "warn"
manual_assert = "warn"
manual_let_else = "warn"
get_unwrap = "warn"
map_unwrap_or = "warn"
empty_drop = "warn"
expl_impl_clone_on_copy = "warn"
unnecessary_self_imports = "warn"
unused_async = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
