[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-antlr"
version = "0.12.0"
description = "Python bindings of dbt-antlr parse trees"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
dependencies = ["cffi>=1.15"]

[project.optional-dependencies]
build = ["setuptools>=61"]
test = ["pytest>=7", "setuptools>=61"]

[tool.setuptools]
packages = ["dbt_antlr"]

[tool.setuptools.package-data]
dbt_antlr = ["antlr.h", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
