[package]
name = "build-generate"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
publish = false

[dependencies]
dbt-antlr-runtime = { workspace = true }

[build-dependencies]
dbt-antlr-codegen = { workspace = true, features = ["generator"] }

[lints]
workspace = true

# Ensure the build.rs itself is always built in release mode, as it directly
# affects the speed of `dbt-antlr-codegen`:
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
