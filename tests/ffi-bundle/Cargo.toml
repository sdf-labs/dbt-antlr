[package]
name = "dbt-antlr-ffi-test-bundle"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Test bundle of dbt_antlr_runtime::ffi: the CSV, Labels, and Keywords grammars"
license = { workspace = true }
publish = false

[lib]
# The Python tests (python/tests) link the static library into a CFFI
# extension module. The Rust tests (tests/abi.rs) use the rlib.
crate-type = ["rlib", "staticlib"]

[features]
arena-allocation-limit = ["dbt-antlr-runtime/arena-allocation-limit"]

[dependencies]
dbt-antlr-runtime = { workspace = true, features = ["ffi"] }

[lints]
workspace = true
