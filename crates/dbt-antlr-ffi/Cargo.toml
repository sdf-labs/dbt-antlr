[package]
categories = ["api-bindings", "parser-implementations", "parsing"]
description = "C ABI over dbt-antlr-runtime parse trees, for foreign-language bindings"
documentation = "https://docs.rs/dbt-antlr-ffi"
edition = { workspace = true }
include = ["/Cargo.toml", "/README.md", "/cbindgen.toml", "/include/**", "/src/**"]
keywords = ["antlr", "antlr4", "ffi", "parser", "python"]
license = { workspace = true }
name = "dbt-antlr-ffi"
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[features]
# Makes `antlr_set_arena_allocation_limit` set the default arena allocation
# limit of `dbt-antlr-runtime`. Without this feature, the function has no
# effect and returns `false`.
arena-allocation-limit = ["dbt-antlr-runtime/arena-allocation-limit"]

[dependencies]
dbt-antlr-runtime = { workspace = true }

[dev-dependencies]
cbindgen = { version = "0.29.4", default-features = false }

[lints]
workspace = true
